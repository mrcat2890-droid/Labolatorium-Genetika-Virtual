            .risk-bar { min-width: 18px; }
            .dots-grid { grid-template-columns: repeat(25, 1fr); }
            .dot-birth { width: 6px; height: 6px; }
        }
    </style>
</head>

    function goToStep(step) {
        clearInterval(meiosisAutoInterval);
        currentStep = step;
        for (let i = 0; i < totalSteps; i++) {
            const btn = document.getElementById(`step-btn-${i}`);
            if (btn) btn.classList.toggle('active', i === step);
        }
        document.getElementById('progress-bar').style.width = `${((step + 1) / totalSteps) * 100}%`;
        renderStep();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderStep() {
        const c = document.getElementById('main-content');
        c.innerHTML = '';
        switch (currentStep) {
            case 0: renderOverview(c); break;
            case 1: renderTypes(c); break;
            case 2: renderMeiosis(c); break;
            case 3: renderKaryotype(c); break;
            case 4: renderPhenotype(c); break;
            case 5: renderRisk(c); break;
            case 6: renderSummary(c); break;
        }
    }

    function setMeiosisMode(mode) {
        meiosisMode = mode;
        meiosisStage = 0;
        clearInterval(meiosisAutoInterval);
        renderMeiosis(document.getElementById('main-content'));
    }

    function setMeiosisStage(stage) {
        meiosisStage = stage;
        for (let i = 0; i < 5; i++) {
            const b = document.getElementById(`stage-btn-${i}`);
            if (b) {
                b.className = `px-2.5 py-1.5 rounded-md font-mono text-[10px] font-bold transition-all ${meiosisStage === i ? 'bg-indigo-500 text-white shadow-lg shadow-indigo-500/30' : 'bg-white/[0.04] text-slate-400 hover:text-white'}`;
            }
        }
        renderMeiosisStageView();
    }

    function resetMeiosisStage() {
        clearInterval(meiosisAutoInterval);
        const playBtn = document.getElementById('meiosis-play-btn');
        if (playBtn) playBtn.textContent = '▶ PUTAR OTOMATIS';
        setMeiosisStage(0);
    }

    function toggleMeiosisAuto() {
        const playBtn = document.getElementById('meiosis-play-btn');
        if (meiosisAutoInterval) {
            clearInterval(meiosisAutoInterval);
            meiosisAutoInterval = null;
            if (playBtn) playBtn.textContent = '▶ PUTAR OTOMATIS';
        } else {
            if (playBtn) playBtn.textContent = '⏸ JEDA';
            meiosisAutoInterval = setInterval(() => {
                if (meiosisStage < 4) {
                    setMeiosisStage(meiosisStage + 1);
                } else {
                    setMeiosisStage(0);
                }
            }, 2600);
        }
    }

    function selectChromosome(id) {
        selectedKaryoChr = id;

    function renderKaryotypeGrid() {
        const cont = document.getElementById('karyotype-grid-container');
        if (!cont) return;

        const sizes = CHROMOSOME_DATA.map(c => c.sizeMb);
        const maxH = 50;
        const maxSize = Math.max(...sizes);

        function chrSVG(h, color = '#818cf8', glow = false) {
            const topH = Math.max(Math.round(h * 0.45), 6);
            const botH = Math.max(Math.round(h * 0.55), 7);
            return `<div class="flex flex-col items-center gap-0 ${glow ? 'animate-pulse' : ''}">
                <div style="width:7px;height:${topH}px;background:${color};border-radius:3px;${glow ? 'box-shadow:0 0 10px ' + color : ''}"></div>
                <div style="width:9px;height:3px;background:rgba(255,255,255,0.3);border-radius:1px;"></div>
                <div style="width:7px;height:${botH}px;background:${color};border-radius:3px;${glow ? 'box-shadow:0 0 10px ' + color : ''}"></div>
            </div>`;
        }

        let html = `
            <div class="flex justify-between items-center mb-4 border-b border-white/5 pb-2">
                <span class="font-mono text-xs text-slate-400">PETA SITOGENETIKA METAMORFOSE G-BANDING</span>
                <span class="font-mono text-amber-300 font-bold text-sm bg-amber-500/10 px-3 py-1 rounded border border-amber-500/20">
                    KARIOTIPE: 47,${karyoSex},+21
                </span>
            </div>
            <div class="flex flex-wrap justify-center gap-x-2.5 gap-y-3.5">
        `;

        for (let i = 0; i < 22; i++) {
            const chrNum = i + 1;
            const h = Math.round((sizes[i] / maxSize) * maxH);
            const isTrisomy = (chrNum === 21);
            const isSelected = (selectedKaryoChr === chrNum);
            const color = isTrisomy ? '#f87171' : (isSelected ? '#a5b4fc' : '#818cf8');

            html += `
                <div class="karyotype-pair ${isTrisomy ? 'trisomy' : ''} ${isSelected ? 'selected' : ''}" 
                     onclick="selectChromosome(${chrNum})" 
                     title="Klik untuk menganalisis Kromosom ${chrNum}">
                    ${chrSVG(h, color, isTrisomy)}
                    ${chrSVG(h, color, isTrisomy)}
                    ${isTrisomy ? chrSVG(h, '#ef4444', true) : ''}
                    <div class="karyotype-label ${isTrisomy ? 'text-red-400 font-bold' : ''}">#${chrNum}</div>
                </div>
            `;
        }

        // Gonosomes
        const xH = Math.round((155 / maxSize) * maxH);
        const yH = Math.round((57 / maxSize) * maxH);
        const isSexSelected = (selectedKaryoChr === 23);

        html += `
            <div class="karyotype-pair ${isSexSelected ? 'selected' : ''}" onclick="selectChromosome(23)" title="Kromosom Seks ${karyoSex}">
                ${chrSVG(xH, '#f472b6')}
                ${karyoSex === 'XX' ? chrSVG(xH, '#f472b6') : chrSVG(yH, '#38bdf8')}
                <div class="karyotype-label text-pink-300 font-bold">${karyoSex}</div>
            </div>
        `;

        html += '</div>';

        // Legend
        html += `
            <div class="flex flex-wrap justify-center gap-4 mt-5 pt-3 border-t border-white/5">
                <div class="flex items-center gap-2"><div class="w-3 h-5 bg-indigo-400/70 rounded-sm"></div><span class="text-[10px] text-slate-400">Autosom Normal Disomi (2x)</span></div>
                <div class="flex items-center gap-2"><div class="w-3 h-5 bg-red-400/90 rounded-sm animate-pulse"></div><span class="text-[10px] text-red-400 font-bold">Kromosom 21 Ekstra (Trisomi 3x)</span></div>
                <div class="flex items-center gap-2"><div class="w-3 h-5 bg-pink-400/70 rounded-sm"></div><span class="text-[10px] text-slate-400">Kromosom Seks (${karyoSex})</span></div>
            </div>
        `;

        cont.innerHTML = html;
    }

                </div>
            </div>

            <!-- Molecular Cause of Maternal Age Effect -->
            <div class="glass-panel p-5">
                <h3 class="text-sm font-display font-bold text-purple-400 tracking-wider mb-3">🧬 MEKANISME MOLEKULER: DEGRADASI KOMPLEKS KOHESIN</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="bg-white/[0.03] border border-white/5 rounded-xl p-3.5">
                        <div class="text-xs font-bold text-amber-300 mb-1">Deteriorasi Kompleks Kohesin (REC8 & SMC1B)</div>
                        <p class="text-[11px] text-slate-300 leading-relaxed">
                            Cincin protein kohesin memegang kromatid saudara bersama-sama sejak masa prenatal. Selama dekade penantian oosit di ovarium, protein kohesin perlahan terdegradasi tanpa adanya sintesis pengganti baru, memicu pemisahan kromatid dini yang kacau saat meiosis dilanjutkan.
                        </p>
                    </div>
                    <div class="bg-white/[0.03] border border-white/5 rounded-xl p-3.5">
                        <div class="text-xs font-bold text-cyan-300 mb-1">Skrining Prenatal Modern (NIPT & Amniosentesis)</div>
                        <p class="text-[11px] text-slate-300 leading-relaxed">
                            Kini skrining trisomi dapat dilakukan sejak usia kehamilan 10 minggu melalui <strong class="text-white">NIPT (Non-Invasive Prenatal Testing)</strong> dengan menganalisis serpihan *cell-free fetal DNA* di darah perifer ibu, dengan akurasi sensitivitas >99%.
                        </p>
                    </div>
                </div>
            </div>

            ${nav(4, 'FENOTIPE', 6, 'RINGKASAN')}`
        );
        updateRiskDisplay(30);
    }

    function setSliderAge(a) {
        const slider = document.getElementById('age-risk-slider');
        if (slider) {
            slider.value = a;
            onSliderChange();
        }
    }

    function onSliderChange() {
        const slider = document.getElementById('age-risk-slider');
        if (slider) updateRiskDisplay(parseInt(slider.value));
    }

    function updateRiskDisplay(age) {
        const disp = document.getElementById('age-value-display');
        const metric = document.getElementById('risk-metric-box');
        const grid = document.getElementById('dots-grid-box');
        if (!disp || !metric || !grid) return;

        disp.textContent = age;

        // Interpolate risk
        const data = MATERNAL_AGE_RISK;
        let risk, label, rate;
        if (age <= data[0].age) {
            risk = data[0].risk; label = data[0].label; rate = data[0].ratePerThousand;
        } else if (age >= data[data.length - 1].age) {
            risk = data[data.length - 1].risk; label = data[data.length - 1].label; rate = data[data.length - 1].ratePerThousand;
        } else {
            for (let i = 0; i < data.length - 1; i++) {
                if (age >= data[i].age && age <= data[i + 1].age) {
                    const t = (age - data[i].age) / (data[i + 1].age - data[i].age);
                    risk = data[i].risk + t * (data[i + 1].risk - data[i].risk);
                    rate = data[i].ratePerThousand + t * (data[i + 1].ratePerThousand - data[i].ratePerThousand);
                    const denom = Math.round(1 / risk);
                    label = `~1:${denom}`;
                    break;
                }
            }
        }

        const pct = (risk * 100).toFixed(2);
        const affectedDots = Math.max(Math.round(rate), (age >= 35 ? 3 : 1));

        const levelColor = age < 30 ? 'emerald' : (age < 35 ? 'amber' : (age < 40 ? 'orange' : 'red'));
        const levelText = age < 30 ? '🟢 Risiko Dasar / Rendah' : (age < 35 ? '🟡 Risiko Moderat' : (age < 40 ? '🟠 Risiko Meningkat' : '🔴 Risiko Tinggi'));

        metric.innerHTML = `
            <div class="text-2xl font-display font-bold text-${levelColor}-400">${label}</div>
            <div class="text-xs font-mono text-slate-300 mt-1">Probabilitas: ~${pct}%</div>
            <div class="text-[11px] font-mono text-slate-400 mt-1">~${rate.toFixed(1)} kasus per 1.000 kelahiran</div>
            <div class="text-[11px] font-bold text-${levelColor}-300 mt-3 bg-${levelColor}-500/10 py-1 px-2 rounded">${levelText}</div>
        `;

        // Render 1000 dots (or 500 scaled for DOM efficiency)
        let dotsHTML = '';
        const totalVisualDots = 500;
        const visualAffected = Math.max(Math.round((affectedDots / 1000) * totalVisualDots), (age >= 35 ? 1 : 0));

        for (let i = 0; i < totalVisualDots; i++) {
            const isAff = (i < visualAffected);
            dotsHTML += `<div class="dot-birth ${isAff ? 'affected' : ''}"></div>`;
        }
        grid.innerHTML = dotsHTML;
    }

    function renderCascadeAnimation() {
        const cascadeSteps = [
            { icon: '🥚', title: '1. Oogenesis Terhenti di Profase I', desc: 'Oosit tersimpan selama dekade di ovarium; kompleks kohesin pelindung kromatid perlahan terdegradasi.', color: 'indigo' },
            { icon: '⚠️', title: '2. Nondisjunction Meiosis I / II', desc: 'Kromosom 21 homolog atau kromatid saudara gagal memisah ke kutub berlawanan saat meiosis dilanjutkan.', color: 'red' },
            { icon: '🔬', title: '3. Terbentuk Gamet Disomik (n+1 = 24)', desc: 'Ovum membawa 2 salinan kromosom 21 alih-alih 1 salinan haploid normal.', color: 'amber' },
            { icon: '🧬', title: '4. Fertilisasi Menghasilkan Zigot 47 Kromosom', desc: 'Penyatuan dengan sperma normal (23) menghasilkan embrio dengan kariotipe 47,XX,+21 atau 47,XY,+21.', color: 'purple' },
            { icon: '📈', title: '5. Overekspresi Genetik Regio 21q22 (Dosis 150%)', desc: 'Gen DYRK1A, APP, SOD1, dan RCAN1 memproduksi kelebihan protein yang mengganggu homeostasis seluler.', color: 'cyan' },
            { icon: '👶', title: '6. Manifestasi Fenotipik Sindrom Down', desc: 'Muncul spektrum klinis: disabilitas kognitif, kelainan jantung bawaan (AVSD), hipotonia, dan ciri kraniofasial khas.', color: 'rose' }
        ];

        const cont = document.getElementById('summary-cascade-container');
        if (!cont) return;

        cascadeSteps.forEach((s, i) => {
            setTimeout(() => {
                const el = document.createElement('div');
                el.className = `flex items-start gap-3 p-3 rounded-xl bg-${s.color}-500/10 border border-${s.color}-500/20 shadow-md`;
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
                el.innerHTML = `
                    <span class="text-2xl shrink-0 mt-0.5">${s.icon}</span>
                    <div>

                        <div class="text-[11px] text-slate-300 mt-0.5 leading-relaxed">${s.desc}</div>
                    </div>

                cont.appendChild(el);

                    el.style.transition = 'all 0.4s ease-out';
