<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-radial" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#081726" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#030712" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#010308" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#00ff41" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo Gradients -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#00ff41"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="70%" stop-color="#00ff41" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-strong" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="1.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00f3ff" stroke-width="0.6" stroke-opacity="0.05"/>
    </pattern>
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.9; filter: drop-shadow(0 0 8px rgba(0,243,255,0.6)); }
      50% { opacity: 1; filter: drop-shadow(0 0 16px rgba(0,255,65,0.7)); }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    .ascii-art {
      font-family: 'Consolas', 'Courier New', 'Courier', monospace;
      font-size: 13.5px;
      font-weight: 700;
      white-space: pre;
    }
    .header-text {
      font-family: 'Consolas', 'Courier Prime', monospace;
      font-size: 11px;
      letter-spacing: 0.16em;
      fill: #94a3b8;
    }
    .status-badge {
      font-family: 'Consolas', monospace;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.12em;
    }
    .pulse-layer {
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .blink {
      animation: blinkDot 1.8s ease-in-out infinite;
    }
  </style>

  <!-- Frame Background -->
  <rect width="940" height="360" rx="16" fill="url(#bg-radial)"/>
  <rect width="940" height="360" rx="16" fill="url(#cyber-grid)"/>
  <circle cx="470" cy="180" r="280" fill="url(#center-glow)"/>
  <rect width="940" height="360" rx="16" fill="url(#scanlines)"/>

  <!-- Border & Top Specular Line -->
  <rect x="1" y="1" width="938" height="358" rx="15" fill="none" stroke="url(#border-grad)" stroke-width="1.5"/>
  <line x1="40" y1="1" x2="900" y2="1" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.8" filter="url(#glow-subtle)"/>

  <!-- Corner Brackets -->
  <path d="M 14 30 L 14 14 L 30 14" fill="none" stroke="#00f3ff" stroke-width="2.5"/>
  <path d="M 926 30 L 926 14 L 910 14" fill="none" stroke="#00f3ff" stroke-width="2.5"/>
  <path d="M 14 330 L 14 346 L 30 346" fill="none" stroke="#00ff41" stroke-width="2.5"/>
  <path d="M 926 330 L 926 346 L 910 346" fill="none" stroke="#00ff41" stroke-width="2.5"/>

  <!-- Top System Bar -->
  <g transform="translate(28, 18)">
    <circle cx="6" cy="12" r="4" fill="#ef4444" opacity="0.8"/>
    <circle cx="20" cy="12" r="4" fill="#f59e0b" opacity="0.8"/>
    <circle cx="34" cy="12" r="4" fill="#00ff41" opacity="0.9" filter="url(#glow-subtle)"/>

    <text x="54" y="15.5" class="header-text">
      <tspan fill="#00f3ff" font-weight="bold">GEN-OS</tspan> // BIOLOGICAL INTERFACE KERNEL v8.2
    </text>

    <!-- Right Status Chips -->
    <rect x="690" y="2" width="112" height="20" rx="10" fill="rgba(0,255,65,0.08)" stroke="#00ff41" stroke-width="0.8"/>
    <circle cx="704" cy="12" r="3.5" fill="#00ff41" class="blink" filter="url(#glow-subtle)"/>
    <text x="715" y="15.5" class="status-badge" fill="#00ff41">SYSTEM ONLINE</text>

    <rect x="812" y="2" width="70" height="20" rx="10" fill="rgba(0,243,255,0.08)" stroke="#00f3ff" stroke-width="0.8"/>
    <text x="847" y="15.5" text-anchor="middle" class="status-badge" fill="#00f3ff">60 FPS</text>
  </g>

  <!-- Divider Line Top -->
  <line x1="28" y1="48" x2="912" y2="48" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- MAIN ASCII ART LOGO & DNA STRANDS -->
  <g transform="translate(0, 68)">
    <!-- Left DNA Strand ASCII in Cyber Cyan & Blue -->
    <text class="ascii-art" x="38" y="22" fill="#38bdf8">  A === T</text>
    <text class="ascii-art" x="38" y="44" fill="#00f3ff"> /   •   \</text>
    <text class="ascii-art" x="38" y="66" fill="#00ff41">|  G ≡ C  |</text>
    <text class="ascii-art" x="38" y="88" fill="#00f3ff"> \   •   /</text>
    <text class="ascii-art" x="38" y="110" fill="#38bdf8">  C === G</text>
    <text class="ascii-art" x="38" y="132" fill="#a855f7">   )(    </text>
    <text class="ascii-art" x="38" y="154" fill="#00ff41">  T === A</text>
    <text class="ascii-art" x="38" y="176" fill="#00f3ff"> /   •   \</text>
    <text class="ascii-art" x="38" y="198" fill="#38bdf8">|  A ≡ T  |</text>

    <!-- Center BIG ASCII GEN - OS in Glowing Gradient -->
    <g class="pulse-layer">
      <text class="ascii-art" x="470" y="32" text-anchor="middle" fill="url(#logo-grad)" filter="url(#glow-strong)">██████╗ ███████╗███╗   ██╗       ██████╗ ███████╗</text>
      <text class="ascii-art" x="470" y="55" text-anchor="middle" fill="url(#logo-grad)" filter="url(#glow-strong)">██╔════╝ ██╔════╝████╗  ██║      ██╔═══██╗██╔════╝</text>
      <text class="ascii-art" x="470" y="78" text-anchor="middle" fill="url(#logo-grad)" filter="url(#glow-strong)">██║  ███╗█████╗  ██╔██╗ ██║ ───  ██║   ██║███████╗</text>
      <text class="ascii-art" x="470" y="101" text-anchor="middle" fill="url(#logo-grad)" filter="url(#glow-strong)">██║   ██║██╔══╝  ██║╚██╗██║      ██║   ██║╚════██║</text>
      <text class="ascii-art" x="470" y="124" text-anchor="middle" fill="url(#logo-grad)" filter="url(#glow-strong)">╚██████╔╝███████╗██║ ╚████║      ╚██████╔╝███████║</text>
      <text class="ascii-art" x="470" y="147" text-anchor="middle" fill="url(#logo-grad)" filter="url(#glow-strong)"> ╚═════╝ ╚══════╝╚═╝  ╚═══╝       ╚═════╝ ╚══════╝</text>
    </g>

    <!-- Subtitle Under Logo -->
    <text x="470" y="178" text-anchor="middle" font-family="'Consolas', monospace" font-size="12" font-weight="bold" fill="#f8fafc" letter-spacing="0.2em" filter="url(#glow-subtle)">
      GENETICS OPERATING SYSTEM • VIRTUAL BIOLOGICAL INTERFACE
    </text>

    <!-- Tags Row -->
    <g transform="translate(470, 204)">
      <rect x="-250" y="-12" width="110" height="20" rx="4" fill="rgba(168,85,247,0.12)" stroke="#a855f7" stroke-width="0.8"/>
      <text x="-195" y="2" text-anchor="middle" font-family="'Consolas', monospace" font-size="9.5" font-weight="bold" fill="#c084fc" letter-spacing="0.1em">[ MENDELIAN ]</text>

      <rect x="-125" y="-12" width="115" height="20" rx="4" fill="rgba(0,243,255,0.12)" stroke="#00f3ff" stroke-width="0.8"/>
      <text x="-67.5" y="2" text-anchor="middle" font-family="'Consolas', monospace" font-size="9.5" font-weight="bold" fill="#38bdf8" letter-spacing="0.1em">[ MOLECULAR ]</text>

      <rect x="5" y="-12" width="125" height="20" rx="4" fill="rgba(0,255,65,0.12)" stroke="#00ff41" stroke-width="0.8"/>
      <text x="67.5" y="2" text-anchor="middle" font-family="'Consolas', monospace" font-size="9.5" font-weight="bold" fill="#4ade80" letter-spacing="0.1em">[ CYTOGENETICS ]</text>

      <rect x="145" y="-12" width="105" height="20" rx="4" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="197.5" y="2" text-anchor="middle" font-family="'Consolas', monospace" font-size="9.5" font-weight="bold" fill="#fbbf24" letter-spacing="0.1em">[ BIOTECH ]</text>
    </g>

    <!-- Right DNA Strand ASCII in Matrix Green -->
    <text class="ascii-art" x="806" y="22" fill="#00ff41">  G === C</text>
    <text class="ascii-art" x="806" y="44" fill="#34d399"> /   •   \</text>
    <text class="ascii-art" x="806" y="66" fill="#00f3ff">|  T ≡ A  |</text>
    <text class="ascii-art" x="806" y="88" fill="#34d399"> \   •   /</text>
    <text class="ascii-art" x="806" y="110" fill="#00ff41">  A === T</text>
    <text class="ascii-art" x="806" y="132" fill="#a855f7">   )(    </text>
    <text class="ascii-art" x="806" y="154" fill="#38bdf8">  C === G</text>
    <text class="ascii-art" x="806" y="176" fill="#00f3ff"> /   •   \</text>
    <text class="ascii-art" x="806" y="198" fill="#00ff41">|  G ≡ C  |</text>
  </g>

  <!-- Divider Line Bottom -->
  <line x1="28" y1="306" x2="912" y2="306" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Bottom Telemetry Footer -->
  <g transform="translate(28, 330)">
    <text x="8" y="10" font-family="'Consolas', monospace" font-size="10" fill="#64748b" letter-spacing="0.14em">
      SYS_ID: <tspan fill="#94a3b8">GEN-OS-TADRIS-2026</tspan> // MODULES: <tspan fill="#00ff41" font-weight="bold">15 ACTIVE</tspan> // LATENCY: <tspan fill="#00f3ff" font-weight="bold">0 ms</tspan> // ENGINE: <tspan fill="#c084fc">CANVAS 60FPS</tspan>
    </text>
    <text x="876" y="10" text-anchor="end" font-family="'Consolas', monospace" font-size="10" fill="#94a3b8" letter-spacing="0.12em">
      UIN PALANGKA RAYA • TADRIS BIOLOGI
    </text>
  </g>
</svg>
