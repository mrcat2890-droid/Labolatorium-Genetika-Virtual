<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" width="100%" height="100%">
  <!-- Clean Deep Dark Background -->
  <rect width="780" height="240" rx="10" fill="#030712"/>

  <style>
    .ascii-logo {
      font-family: 'Consolas', 'Courier New', 'Courier', monospace;
      font-size: 14.5px;
      font-weight: 700;
      white-space: pre;
      fill: #00f3ff;
    }
    .subtitle-text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.22em;
      fill: #ffffff;
    }
    .badge-box {
      fill: rgba(0, 243, 255, 0.05);
      stroke: #00f3ff;
      stroke-width: 1;
    }
    .badge-text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      fill: #00f3ff;
    }
  </style>

  <!-- 1. ASCII LOGO: GEN - OS (1 Warna: #00f3ff, Tanpa Glow, Sederhana) -->
  <g transform="translate(390, 36)">
    <text class="ascii-logo" x="0" y="0" text-anchor="middle">██████╗ ███████╗███╗   ██╗       ██████╗ ███████╗</text>
    <text class="ascii-logo" x="0" y="22" text-anchor="middle">██╔════╝ ██╔════╝████╗  ██║      ██╔═══██╗██╔════╝</text>
    <text class="ascii-logo" x="0" y="44" text-anchor="middle">██║  ███╗█████╗  ██╔██╗ ██║ ───  ██║   ██║███████╗</text>
    <text class="ascii-logo" x="0" y="66" text-anchor="middle">██║   ██║██╔══╝  ██║╚██╗██║      ██║   ██║╚════██║</text>
    <text class="ascii-logo" x="0" y="88" text-anchor="middle">╚██████╔╝███████╗██║ ╚████║      ╚██████╔╝███████║</text>
    <text class="ascii-logo" x="0" y="110" text-anchor="middle"> ╚═════╝ ╚══════╝╚═╝  ╚═══╝       ╚═════╝ ╚══════╝</text>
  </g>

  <!-- 2. SUBTITLE (Teks Putih Bersih, Tanpa Glow) -->
  <text class="subtitle-text" x="390" y="174" text-anchor="middle">
    GENETICS OPERATING SYSTEM • VIRTUAL BIOLOGICAL INTERFACE
  </text>

  <!-- 3. EMPAT BADGE (1 Warna Aksen #00f3ff, Simetris) -->
  <g transform="translate(390, 195)">
    <!-- [ MENDELIAN ] -->
    <rect class="badge-box" x="-262.5" y="0" width="120" height="24" rx="4"/>
    <text class="badge-text" x="-202.5" y="16" text-anchor="middle">[ MENDELIAN ]</text>

    <!-- [ MOLECULAR ] -->
    <rect class="badge-box" x="-127.5" y="0" width="120" height="24" rx="4"/>
    <text class="badge-text" x="-67.5" y="16" text-anchor="middle">[ MOLECULAR ]</text>

    <!-- [ CYTOGENETICS ] -->
    <rect class="badge-box" x="7.5" y="0" width="135" height="24" rx="4"/>
    <text class="badge-text" x="75" y="16" text-anchor="middle">[ CYTOGENETICS ]</text>

    <!-- [ BIOTECH ] -->
    <rect class="badge-box" x="157.5" y="0" width="105" height="24" rx="4"/>
    <text class="badge-text" x="210" y="16" text-anchor="middle">[ BIOTECH ]</text>
  </g>
</svg>
